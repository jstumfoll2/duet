plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// THIRD_PARTY_NOTICES ships inside the APK (Settings > Open-source licenses),
// copied from the repo root at build time so the file and the in-app screen
// cannot drift.
def noticesDir = layout.buildDirectory.dir('generated/notices')

// Release signing is optional: builds stay green without a keystore, and
// keystore.properties never enters version control.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.kinetica.keyboard'
    compileSdk 34
    // AGP 8.5.2 already defaults to these build-tools, so pinning changes
    // nothing locally. It matters because F-Droid rebuilds the tagged release
    // and compares it against the published APK: every input that could drift
    // between two machines has to be fixed in the build script.
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "io.github.jstumfoll2.duet"
        minSdk 26
        targetSdk 34
        versionCode 98
        versionName "2.1.21"
    }

    sourceSets {
        main {
            assets.srcDirs += noticesDir
            // libduet_harper.so (Harper grammar checker), built by
            // native/harper-jni/build-android.sh; absent, the app builds without it.
            jniLibs.srcDirs += rootProject.file('native/harper-jni/target/jniLibs')
        }
    }

    // DEV builds sign with one fixed key kept in the repo, so each new DEV APK
    // installs as an update over the last instead of needing an uninstall. It is
    // a sideload-only key for the .dev app id, not a secret; release signing
    // stays on keystore.properties below.
    signingConfigs {
        debug {
            storeFile file('duet-dev.keystore')
            storePassword 'duet-dev'
            keyAlias 'duet-dev'
            keyPassword 'duet-dev'
        }
    }

    if (keystorePropsFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    // AGP otherwise writes a Google-signed protobuf of the dependency tree into the
    // APK signing block: a Play Store feature, opaque to anyone inspecting the APK,
    // and rejected by F-Droid's scanner.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // A second application id, so the debug build installs beside the real
        // app with its own data and cannot be mistaken for a published build. It is
        // also the only build that writes a decode trace (TraceRecorder).
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            // Not debuggable, so the decode times a trace records are the phone's real cost:
            // ART runs a debuggable build about twice as slow. The trace sink comes from the
            // debug source set and needs no flag.
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            // The engine golden tests read the real dictionary and layout assets off disk; the
            // Robolectric tests of the service (ImeWiringTest) need them merged, as the APK has them.
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
            }
        }
    }
}

// Android only installs an update whose versionCode is not lower than the
// installed one, and the DEV build changes far more often than the release
// version does. CI passes the commit time in minutes as -PdevVersionCode, so
// every newer DEV APK carries a higher code; local builds keep defaultConfig's.
def devVersionCode = project.findProperty('devVersionCode')
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        if (devVersionCode != null) {
            variant.outputs.each { it.versionCode.set(devVersionCode.toString().toInteger()) }
        }
    }
}

tasks.register('copyThirdPartyNotices', Copy) {
    from rootProject.file('THIRD_PARTY_NOTICES')
    into noticesDir
    rename { 'third_party_notices.txt' }
}
preBuild.dependsOn copyThirdPartyNotices

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Inline autofill chips (Android 11+): builds the chip style bundle the platform expects.
    implementation 'androidx.autofill:autofill:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    // Runs the service itself on the JVM (ImeWiringTest); test-only, never in the APK.
    testImplementation 'org.robolectric:robolectric:4.13'
}
