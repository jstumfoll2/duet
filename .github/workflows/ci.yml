name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a build be started by hand from the Actions tab, e.g. after Actions was off.
  workflow_dispatch:

# Build and test only read the repository; the artifact upload uses its own runtime token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK with platform 34 / build-tools
      # 34.0.0 preinstalled; ANDROID_HOME is exported by the runner image.

      - uses: gradle/actions/setup-gradle@v3
        with:
          # A pull request that swaps gradle-wrapper.jar fails here instead of running it.
          validate-wrappers: true

      # Harper's native library, packed into both APKs and loaded by HarperNativeTest.
      - uses: ./.github/actions/harper

      # The project's exact green gate: build both apps, JVM golden suite, lint. The
      # DEV versionCode is the commit time in minutes, so newer builds always update.
      - run: ./gradlew assembleDebug assembleRelease test lint -PdevVersionCode=$(( $(git log -1 --format=%ct) / 60 ))

      # The fixed DEV key's certificate, so two runs can be compared at a glance.
      - name: Show the DEV APK's signer
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E 'DN|SHA-256'
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/build/outputs/apk/debug/*.apk | head -1

      # The DEV build (io.github.jstumfoll2.duet.dev, with the trace screen and
      # practice mode), for installing by hand. Signed with the fixed DEV key in
      # app/duet-dev.keystore, so each one installs as an update over the last.
      - uses: actions/upload-artifact@v4
        with:
          name: duet-dev-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # The release build (io.github.jstumfoll2.duet: no trace screen, records nothing).
      # CI holds no release key, so this APK is unsigned: it proves the release variant
      # builds, and a published release signs it with the KEYSTORE_* key.
      - uses: actions/upload-artifact@v4
        with:
          name: duet-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # The engine and trace-replay harness as a plain JVM build: no Android SDK,
  # so it fails fast on engine regressions and runs the exact-replay gate.
  engine-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - run: ./gradlew -p tools/replay test

  # The release step a pull request will cause once merged (see auto-release.yml),
  # read from its title the same way, plus the classifier's own checks.
  release-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: tools/release/test_release_level.sh

      - name: Show this pull request's release step
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
        run: |
          set -euo pipefail
          label=$(printf '%b\n' "$LABELS" | grep -xE 'release:(skip|patch|minor|major)' | head -1 || true)
          step=$({ [ -n "$label" ] && printf '%s\n' "$label"; printf '%s\n%s\0' "$TITLE" "$BODY"; } \
            | tools/release/release_level.sh)
          echo "Merging this releases: **$step**${label:+ (label $label)}" >> "$GITHUB_STEP_SUMMARY"
          echo "release step: $step"
          if [ -z "$label" ] && ! [[ "$TITLE" =~ ^[A-Za-z]+(\([^\)]*\))?!?:\  ]]; then
            echo "::warning title=No Conventional Commit prefix::'$TITLE' has no type prefix, so it releases as a patch. Start it with feat:, fix:, perf:, docs:, chore:, ci: or test: (add ! for a breaking change)."
          fi
