name: Release

# Pushing a vX.Y.Z tag builds, signs and publishes that version. The APK this
# workflow attaches is the artifact F-Droid verifies its own rebuild against, so
# the runner image and the toolchain are pinned rather than floating.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # The signing key exists only as a repository secret. keystore.properties
      # is the same file app/build.gradle reads for a local release build, so
      # the build script needs no CI-specific branch.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/kinetica-release.keystore
          {
            printf 'storeFile=keystore/kinetica-release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      # A release passes the same gate as any other change: JVM golden suite and
      # lint before anything is signed.
      - run: ./gradlew test lint assembleRelease

      # %v in the F-Droid Binaries URL is the versionName, so a tag that
      # disagrees with build.gradle would publish an asset F-Droid cannot find.
      # Fail here instead of discovering it in the fdroiddata pipeline.
      - name: Name the APK after the tag and verify its signature
        id: apk
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          if [ "$version" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME implies versionName $version but build.gradle declares $declared" >&2
            exit 1
          fi
          # An unconfigured signingConfig is silent: AGP just emits
          # app-release-unsigned.apk instead. Say so rather than failing on a
          # missing file.
          built=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$built" ]; then
            echo "no signed APK at $built - the release signingConfig did not apply," >&2
            echo "check the KEYSTORE_* repository secrets" >&2
            ls -l app/build/outputs/apk/release/ >&2
            exit 1
          fi
          apk="kinetica-${version}.apk"
          mv "$built" "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)" >> "$GITHUB_OUTPUT"

      # Release notes come from the F-Droid changelog for this versionCode, so
      # the store listing and the GitHub release cannot drift apart.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.apk }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          set -euo pipefail
          notes="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          gh release create "$GITHUB_REF_NAME" \
            --title "Kinetica $VERSION" \
            --notes-file "$notes" \
            "$APK"

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f keystore.properties keystore/kinetica-release.keystore
