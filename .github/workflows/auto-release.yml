name: Auto release

# Every change merged to main that passes CI becomes a release: this bumps the
# version in app/build.gradle, commits that bump to main, tags it vX.Y.Z and
# publishes a GitHub release with the APKs and notes generated from the merged
# pull requests.
#
# The bump is a patch by default. Label the pull request `release:minor` or
# `release:major` for a bigger step, or `release:skip` to merge without a
# release. Run it by hand (Actions > Auto release > Run workflow) to pick the
# step yourself.
#
# No loop: the bump commit and tag are pushed with GITHUB_TOKEN, and GitHub
# never starts workflows (CI included) from a GITHUB_TOKEN push. Even so, a run
# whose main already ends in a release commit does nothing.
#
# Signing: with the KEYSTORE_* repository secrets that release.yml uses, the
# release APK is signed with that key and installs as an update over the
# previous release. The DEV APK is always attached, signed with the fixed DEV
# key in app/duet-dev.keystore, so it too installs as an update.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One release at a time, and never cancel one half way through a push.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    # Only CI runs on a push to this repository's main (a merge), never CI on a
    # pull request, and only when CI passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write        # push the bump commit and tag, create the release
      pull-requests: read    # read the merged pull request's labels
    steps:
      # The tip of main, not the commit CI ran on: a later merge or an earlier
      # release's bump commit may already be on top of it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Decide the version step
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          MERGED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          if [ "$EVENT" != workflow_dispatch ] && [[ "$subject" =~ ^Release\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "main already ends in '$subject'; nothing new to release"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            bump="$INPUT_BUMP"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGED_SHA/pulls" \
              --jq '.[0].labels[]?.name' 2>/dev/null || true)
            echo "pull request labels: ${labels:-none}"
            if grep -qx 'release:skip' <<<"$labels"; then bump="none"
            elif grep -qx 'release:major' <<<"$labels"; then bump="major"
            elif grep -qx 'release:minor' <<<"$labels"; then bump="minor"
            else bump="patch"
            fi
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.plan.outputs.bump != 'none'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        if: steps.plan.outputs.bump != 'none'

      - name: Bump the version
        id: version
        if: steps.plan.outputs.bump != 'none'
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          version=$(tools/release/bump_version.sh "$BUMP")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists; fix versionName in app/build.gradle" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          git diff app/build.gradle

      # Same restore as release.yml. Skipped, not failed, when the secrets are
      # absent: the build script then leaves the release APK unsigned.
      - name: Restore the release keystore
        id: keystore
        if: steps.plan.outputs.bump != 'none'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: this release ships only the debug-signed DEV APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/kinetica-release.keystore
          {
            printf 'storeFile=keystore/kinetica-release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # CI already ran the tests and lint on this code; the bump only changes
      # the version, so build the APKs and nothing more.
      - name: Build the APKs
        if: steps.plan.outputs.bump != 'none'
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          dev_code=$(( $(git log -1 --format=%ct) / 60 ))
          if [ "$SIGNED" = true ]; then
            ./gradlew assembleDebug assembleRelease -PdevVersionCode="$dev_code"
          else
            ./gradlew assembleDebug -PdevVersionCode="$dev_code"
          fi

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f keystore.properties keystore/kinetica-release.keystore

      - name: Collect the release files
        if: steps.plan.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/duet-dev-$VERSION.apk"
          if [ "$SIGNED" = true ]; then
            built=app/build/outputs/apk/release/app-release.apk
            if [ ! -f "$built" ]; then
              echo "no signed APK at $built: check the KEYSTORE_* secrets" >&2
              ls -l app/build/outputs/apk/release/ >&2
              exit 1
            fi
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$built"
            cp "$built" "dist/duet-$VERSION.apk"
          fi
          ls -l dist

      # Push the commit and its tag together, so main never carries a release
      # commit without a tag or the other way round. If another merge landed
      # while this built, step aside: that merge's own run releases both, and
      # this APK would not contain it.
      - name: Commit and tag the version
        id: push
        if: steps.plan.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Release v$VERSION" -- app/build.gradle
          git tag "v$VERSION"
          if git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$base" ]; then
            echo "::notice::main moved during the build; the run for the newer merge releases it."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "could not push the release commit to main. If a ruleset requires pull requests on main, let github-actions bypass it." >&2
          exit 1

      - name: Publish the release
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          args=(--title "Duet $VERSION" --generate-notes --verify-tag)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$SIGNED" != true ]; then
            args+=(--notes "Only the DEV build is attached. It is signed with the fixed DEV key, so it installs as an update over any earlier DEV build signed with that key.")
          fi
          gh release create "v$VERSION" "${args[@]}" dist/*.apk
