# Records the website's screenshots and videos on an Android emulator.
#
# Builds the DEV app and the screenshot tour (app/src/androidTest/.../SiteMediaTour.kt), runs the
# tour on an emulator, converts the captures to WebP and MP4 for site/media/, and uploads them
# as the "site-media" artifact. Each run also pushes them to the branch assets/site-media so a
# session can fetch and review them; copying them into site/media/ is a normal commit.
name: Website media

on:
  push:
    branches-ignore: [main]
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/debug/java/com/kinetica/keyboard/ime/SiteDemoActivity.kt'
      - '.github/workflows/site-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          validate-wrappers: true

      # Harper's native library, so the grammar row works in the tour.
      - uses: ./.github/actions/harper

      - name: Build the DEV app and the tour
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PdevVersionCode=$(( $(git log -1 --format=%ct) / 60 ))

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r -g app/build/outputs/apk/debug/*.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/*.apk
            adb shell am instrument -w -e class com.kinetica.keyboard.SiteMediaTour io.github.jstumfoll2.duet.dev.test/androidx.test.runner.AndroidJUnitRunner || true
            adb logcat -d -s SiteMediaTour:* AndroidRuntime:E TestRunner:* > tour-log.txt || true
            mkdir -p raw && adb pull /sdcard/Download/site/. raw/ || true
            ls -la raw

      - name: Convert for the site
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp > /dev/null
          mkdir -p out
          for f in raw/*.png; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .png)
            cwebp -quiet -q 82 -resize 540 0 "$f" -o "out/$n.webp"
          done
          for f in raw/*.mp4; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .mp4)
            ffmpeg -loglevel error -y -i "$f" -vf "scale=540:-2,fps=30" -c:v libx264 -crf 27 -preset slow \
              -pix_fmt yuv420p -an -movflags +faststart "out/$n.mp4"
            ffmpeg -loglevel error -y -ss 2 -i "out/$n.mp4" -frames:v 1 "raw/$n-poster.png"
            p=${n#duet-}
            cwebp -quiet -q 80 "raw/$n-poster.png" -o "out/$p-poster.webp"
          done
          cp tour-log.txt out/ || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: site-media
          path: |
            out
            raw
          retention-days: 14

      - name: Push to assets/site-media for review
        run: |
          cd out
          git init -q -b assets/site-media
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Website media from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:assets/site-media
